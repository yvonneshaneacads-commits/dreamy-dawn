<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FF8FAB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dreamy Dawn">
<title>Dreamy Dawn</title>
<style>
:root{--bg:#FFF8E8;--card:#FFFDF7;--ink:#2B2B2B;--mut:#8C7A82;--pink:#FF8FAB;--lp:#FFE4EE;--gr:#E2F8C9;--grd:#5E8A2B;--line:#F3C9D6;--warn:#C2294F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1418;--card:#2a1f25;--ink:#f5eaee;--mut:#b9a5ad;--lp:#3a2630;--gr:#2f3d22;--grd:#b8de7f;--line:#4a3440;--warn:#ff8fab}}
:root[data-theme="dark"]{--bg:#1c1418;--card:#2a1f25;--ink:#f5eaee;--mut:#b9a5ad;--lp:#3a2630;--gr:#2f3d22;--grd:#b8de7f;--line:#4a3440;--warn:#ff8fab}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%}
button,input{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 14px 0;border-bottom:2px solid var(--pink)}
.row{display:flex;align-items:center;gap:10px}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--pink);flex:none}
.wel{text-align:center;font-weight:700;font-size:17px;color:var(--pink);margin:0 0 12px}
.hero{display:block;width:100%;height:170px;object-fit:cover;object-position:center 55%;border-radius:16px;border:1.5px solid var(--line);margin-bottom:12px}
h1{margin:0;font-size:22px;color:var(--pink);flex:1}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
#clock{font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;border:0;background:transparent;padding:9px 4px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent}
.tab.on{color:var(--pink);border-color:var(--pink)}
main{padding:12px 14px 40px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--pink)}
.tl{display:flex;justify-content:space-between;gap:6px;text-align:center}
.tl div{flex:1;background:var(--lp);border-radius:12px;padding:10px 4px}
.tl b{display:block;font-size:19px}
.tl span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.chip{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;margin-top:10px;background:var(--gr);color:var(--grd)}
.chip.bad{background:var(--lp);color:var(--warn)}
.flds{display:flex;gap:10px;margin-top:12px}
.flds label{flex:1;font-size:12px;font-weight:700;color:var(--mut)}
.flds input{display:block;width:100%;margin-top:4px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:18px;outline:0}
.btn{border:0;background:var(--pink);color:#fff;font-weight:700;border-radius:12px;padding:12px 14px;width:100%}
.btn.alt{background:var(--lp);color:var(--pink)}
.btn.gr{background:var(--gr);color:var(--grd)}
.btn.off{background:var(--gr);color:var(--grd)}
.btn.big{font-size:17px;padding:16px}
.two{display:flex;gap:8px;margin-top:10px}
.note{font-size:13px;color:var(--mut);margin:10px 0 0}
.warn{background:var(--lp);border:1.5px dashed var(--pink);border-radius:12px;padding:10px;margin-top:10px;font-size:14px}
.warn b{color:var(--warn)}
.ban{background:var(--gr);color:var(--grd);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:space-between}
.ban button{border:0;background:var(--grd);color:var(--gr);border-radius:8px;padding:6px 10px;font-weight:700}
.bar{height:10px;background:var(--lp);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--pink);border-radius:99px;transition:width .2s}
.item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px dashed var(--line)}
.item:last-child{border:0}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--pink);background:var(--card);color:#fff;font-weight:700;line-height:20px;text-align:center}
.item.done .chk{background:var(--pink)}
.item.done .t{text-decoration:line-through;color:var(--mut)}
.t{flex:1;word-break:break-word}
.x{border:0;background:var(--lp);color:var(--warn);width:30px;height:30px;border-radius:9px;font-weight:700}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;border:1.5px dashed var(--pink);background:var(--bg);border-radius:12px;padding:10px;outline:0}
.add .btn{width:auto}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd button{border:0;background:var(--lp);color:var(--pink);border-radius:10px;padding:6px 12px;font-weight:700}
.ring{position:fixed;inset:0;background:var(--pink);color:#fff;display:none;z-index:50;text-align:center;padding:24px;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.ring h2{font-size:64px;margin:0;font-variant-numeric:tabular-nums}
.ring p{font-size:19px;margin:0;max-width:420px}
.ring .btn{background:#fff;color:var(--pink);max-width:320px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<header>
  <div class="row"><img class="av" id="av" alt=""><h1>Dreamy Dawn<small id="st"></small></h1><div id="clock"></div></div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<div class="ring" id="ring"></div>
<div class="toast" id="toast"></div>

function $(s){return document.querySelector(s)}

function fmt(m){m=((m%1440)+1440)%1440;var H=Math.floor(m/60),M=m%60,ap=H>=12?'PM':'AM';H=H%12||12;return H+':'+pad(M)+' '+ap}

function windMin(){return((D.bed-D.prep)%1440+1440)%1440}
function nextTs(m){var d=new Date();d.setHours(Math.floor(m/60),m%60,0,0);if(d.getTime()<=Date.now())d.setDate(d.getDate()+1);return d.getTime()}
function until(ts){var s=Math.max(0,Math.round((ts-Date.now())/60000)),H=Math.floor(s/60),M=s%60;return H?H+'h '+M+'m':M+'m'}
function sd(){var d=new Date(Date.now()-3*3600e3);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function rollDay(){if(D.done.day!==sd()){D.done={day:sd(),night:{},morning:{}};save()}}
function fixes(){return{bed:(((D.wake-D.min)%1440)+1440)%1440,wake:(D.bed+D.min)%1440}}
function unlock(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}
function beep(f,len){if(!ctx)return;try{var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.25;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+len)}catch(e){}}
function keepAwake(on){try{if(on&&navigator.wakeLock&&!wl){navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})}else if(!on&&wl){wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&D.armed)keepAwake(true)});
function arm(){
  if(sleepDur()<D.min){toast('Alarm needs at least '+dur(D.min)+' of sleep. Use a fix below.');return}
  unlock();D.armed=true;D.at=nextTs(D.wake);save();keepAwake(true);render();toast('Alarm set for '+fmt(D.wake)+' (˶ᵔ ᵕ ᵔ˶)')}
function disarm(){D.armed=false;save();keepAwake(false);render()}
function ring(){
  ui.ringing=true;var r=$('#ring');r.replaceChildren(h('div',null,'Wake-up alarm (≧◡≦)'),h('h2',null,fmt(D.wake)),
    h('p',null,'The alarm is across the room. Get up, walk over, and turn it off. ヾ(＾∇＾)'),h('button',{class:'btn big',onclick:stopRing},'I am up! Stop alarm ٩(◕‿◕)۶'));
  r.style.display='flex';var n=0;clearInterval(beepT);beepT=setInterval(function(){beep(n%2?660:880,.3);n++;try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}},600)}
function stopRing(){clearInterval(beepT);ui.ringing=false;$('#ring').style.display='none';D.armed=false;save();keepAwake(false);ui.tab='morning';render()}
function tick(){
  var n=new Date();$('#clock').textContent=fmt(n.getHours()*60+n.getMinutes());rollDay();
  if(D.armed&&!ui.ringing&&Date.now()>=D.at){if(Date.now()-D.at<20*60e3)ring();else{D.armed=false;save();render();toast('Your alarm time passed while the page was closed.')}}
  var md=n.getHours()*60+n.getMinutes(),key=sd()+':'+windMin();
  if(md===windMin()&&lastWind!==key){lastWind=key;ui.wind=true;beep(520,.5);if(ui.tab==='plan'||ui.tab==='night')render()}
  var st=$('#st');
  if(D.armed)st.textContent='Alarm '+fmt(D.wake)+' \u00b7 rings in '+until(D.at);
  else{var ev=[['Wind-down',windMin()],['Lights out',D.bed],['Wake up',D.wake]].map(function(e){return[e[0],nextTs(e[1])]}).sort(function(a,b){return a[1]-b[1]})[0];st.textContent='Next: '+ev[0]+' in '+until(ev[1])}
}
function setT(k,v){var m=parseT(v);if(m==null)return;D[k]=m;if(D.armed){D.armed=false;keepAwake(false);toast('Times changed (・_・;) Alarm turned off, set it again.')}save();render()}
var TK='sleepplan.theme',TM='light';
try{TM=localStorage.getItem(TK)||'light'}catch(e){}
function applyTheme(){var r=document.documentElement;if(TM==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',TM)}
function setTheme(t){TM=t;try{localStorage.setItem(TK,t)}catch(e){}applyTheme();render()}
function themeCard(){return h('div',{class:'card'},h('h2',null,'Look'),h('div',{class:'two',style:'margin-top:0'},[['light','Light'],['dark','Dark'],['auto','Auto']].map(function(x){return h('button',{class:'btn'+(TM===x[0]?'':' alt'),onclick:function(){setTheme(x[0])}},x[1])})),h('p',{class:'note'},'Auto follows your phone\u2019s light or dark setting.'))}
function planTab(m){
  var d=sleepDur(),ok=d>=D.min,f=fixes();
  m.append(h('img',{class:'hero',src:BANNER,alt:''}));
  m.append(h('div',{class:'wel'},'Welcome, Kyvie (˶ᵔ ᵕ ᵔ˶)'));
  if(ui.wind)m.append(h('div',{class:'ban'},h('span',null,'Wind-down time (๑˃ᴗ˂)ﻭ Start your night routine.'),h('button',{onclick:function(){ui.wind=false;ui.tab='night';render()}},'Open')));
  m.append(h('div',{class:'card'},h('h2',null,'Tonight (｡-ω-)zzz'),
    h('div',{class:'tl'},h('div',null,h('b',null,fmt(windMin())),h('span',null,'Wind-down')),h('div',null,h('b',null,fmt(D.bed)),h('span',null,'Lights out')),h('div',null,h('b',null,fmt(D.wake)),h('span',null,'Wake up'))),
    h('span',{class:'chip'+(ok?'':' bad')},ok?dur(d)+' of sleep. Meets your '+dur(D.min)+' minimum (≧◡≦)':'Only '+dur(d)+' of sleep. Needs '+dur(D.min)+' ('+dur(D.min-d)+' short) (；ω；)'),
    h('div',{class:'flds'},
      h('label',null,'Lights out',h('input',{type:'time',value:hhmm(D.bed),onchange:function(){setT('bed',this.value)}})),
      h('label',null,'Wake up',h('input',{type:'time',value:hhmm(D.wake),onchange:function(){setT('wake',this.value)}}))),
    ok?null:h('div',{class:'warn'},h('b',null,'Fix it: '),'a wake-up alarm needs at least '+dur(D.min)+' of sleep.',
      h('div',{class:'two'},h('button',{class:'btn alt',onclick:function(){setT('bed',hhmm(f.bed))}},'Bed at '+fmt(f.bed)),h('button',{class:'btn alt',onclick:function(){setT('wake',hhmm(f.wake))}},'Wake at '+fmt(f.wake))))));
  m.append(h('div',{class:'card'},h('h2',null,'Wake-up alarm (≧◡≦)'),
    h('button',{class:'btn big'+(D.armed?' off':''),onclick:D.armed?disarm:arm},D.armed?'Alarm ON for '+fmt(D.wake)+' (｡-ω-)zzz Tap to turn off':'Set alarm for '+fmt(D.wake)+' (˶ᵔ ᵕ ᵔ˶)'),
    h('div',{class:'two'},h('button',{class:'btn alt',onclick:function(){unlock();beep(880,.4);setTimeout(function(){beep(660,.4)},450);toast('Sound test (๑˃ᴗ˂)ﻭ If you heard nothing, check the silent switch.')}},'Test sound')),
    h('p',{class:'note'},'Put the alarm on the other side of the bed, so you have to get up to turn it off.'),
    h('p',{class:'note'},'This alarm only rings while this page is open with the screen on. To be safe, also set '+fmt(D.wake)+' in your phone\u2019s Clock app.')));
  m.append(h('div',{class:'card'},h('h2',null,'My rules'),
    h('div',{class:'flds'},
      h('label',null,'Wind-down (min before bed)',h('input',{type:'number',inputmode:'numeric',min:'0',max:'360',value:D.prep,onchange:function(){D.prep=Math.max(0,Math.min(360,+this.value||0));save();render()}})),
      h('label',null,'Minimum sleep (min)',h('input',{type:'number',inputmode:'numeric',min:'60',max:'720',value:D.min,onchange:function(){D.min=Math.max(60,Math.min(720,+this.value||465));save();render()}}))),
    h('p',{class:'note'},'Wind-down starts '+dur(D.prep)+' before lights out. Minimum sleep is '+dur(D.min)+'. Default aim: lights out 10:00 PM, wake 5:40 AM.')));
  m.append(themeCard());
}
function listTab(m,k){
  var L=D.lists[k],dn=D.done[k],c=L.filter(function(x){return dn[x.id]}).length,p=L.length?Math.round(c/L.length*100):0;
  if(k==='night'&&ui.wind)m.append(h('div',{class:'ban'},h('span',null,'Wind-down started (｡-ω-) Finish by '+fmt(D.bed)+'.'),h('button',{onclick:function(){ui.wind=false;render()}},'Got it')));
  var card=h('div',{class:'card'},h('div',{class:'hd'},h('h2',{style:'margin:0'},(k==='night'?'Night (｡-ω-)':'Morning (≧◡≦)')+' \u00b7 '+c+'/'+L.length),
    h('button',{onclick:function(){ui.edit=!ui.edit;render()}},ui.edit?'Done':'Edit')),
    h('div',{class:'bar'},h('i',{style:'width:'+p+'%'})));
  if(!L.length)card.append(h('p',{class:'note'},'No items yet. Tap Edit to add some.'));
  L.forEach(function(x){card.append(h('div',{class:'item'+(dn[x.id]?' done':'')},
    h('button',{class:'chk',onclick:function(){dn[x.id]=!dn[x.id];save();render();if(L.every(function(y){return dn[y.id]}))toast('Routine complete (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧')}},dn[x.id]?'\u2713':''),
    h('span',{class:'t'},x.t),
    ui.edit?h('button',{class:'x',onclick:function(){D.lists[k]=L.filter(function(y){return y!==x});save();render()}},'\u00d7'):null))});
  if(ui.edit){var inp=h('input',{placeholder:'Add a step',maxlength:'80'});
    var add=function(){var v=inp.value.trim();if(!v)return;L.push({id:'x'+Date.now().toString(36),t:v});save();render()};
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')add()});card.append(h('div',{class:'add'},inp,h('button',{class:'btn',onclick:add},'Add')))}
  m.append(card);
  m.append(h('button',{class:'btn alt',onclick:function(){D.done[k]={};save();render()}},'Reset today\u2019s checks'));
}
function render(){
  var tabs=$('#tabs');tabs.replaceChildren();
  [['plan','Plan'],['night','Night'],['morning','Morning']].forEach(function(t){tabs.append(h('button',{class:'tab'+(ui.tab===t[0]?' on':''),onclick:function(){ui.tab=t[0];ui.edit=false;render();window.scrollTo(0,0)}},t[1]))});
  var m=$('#main');m.replaceChildren();
  if(ui.tab==='plan')planTab(m);else listTab(m,ui.tab);
  tick();
}
applyTheme();$('#av').src=IMG;load();rollDay();render();setInterval(tick,1000);
if(D.armed)keepAwake(true);
</script>
</body>
